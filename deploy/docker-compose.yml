# Hostinger VPS (Docker + Traefik template) deployment.
#
# Hostinger's Docker manager does not build images, so this runs the stock
# Python image: on start it downloads the branch from GitHub, installs the
# requirements into a cached volume (only when requirements.txt changes) and
# starts Streamlit. Restarting the project deploys the latest commit.
# Traefik on the VPS terminates TLS (Let's Encrypt) and routes the hostname.
services:
  pricision:
    image: python:3.11-slim
    restart: unless-stopped
    working_dir: /app
    environment:
      - DATA_SOURCE=local
      - PIP_DISABLE_PIP_VERSION_CHECK=1
      - PIP_NO_CACHE_DIR=1
      - REPO_TARBALL=https://codeload.github.com/kevinhoung/us_rental_calculator/tar.gz/refs/heads/claude/wizardly-brown-inwcmx
    volumes:
      - pydeps:/deps
    command:
      - sh
      - -c
      - |
        set -e
        python -c "import os, io, shutil, tarfile, urllib.request; data = urllib.request.urlopen(os.environ['REPO_TARBALL'], timeout=120).read(); tar = tarfile.open(fileobj=io.BytesIO(data)); root = tar.getnames()[0].split('/')[0]; tar.extractall('/tmp/src'); shutil.copytree('/tmp/src/' + root, '/app', symlinks=True, dirs_exist_ok=True, ignore=shutil.ignore_patterns('venv_old_python39', '.devcontainer', '.git'))"
        if ! cmp -s requirements.txt /deps/requirements.txt; then
          python -m venv /deps/venv
          /deps/venv/bin/pip install -r requirements.txt
          cp requirements.txt /deps/requirements.txt
        fi
        exec /deps/venv/bin/python -m streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true --browser.gatherUsageStats=false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.pricision.rule=Host(`pricision.srv2145084.hstgr.cloud`)
      - traefik.http.routers.pricision.entrypoints=websecure
      - traefik.http.routers.pricision.tls.certresolver=letsencrypt
      - traefik.http.services.pricision.loadbalancer.server.port=8501

volumes:
  pydeps:
